name: Desktop

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  # Domain, provider adapters and the Electron app all typecheck and test with
  # the same toolchain, so one job covers the workspace. `bun run --filter '*'`
  # walks every workspace package rather than naming them here, which keeps this
  # file correct when a package is added.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      # The renderer is the one artifact a type error cannot catch on its own:
      # Vite resolves the workspace packages and the CSS, and a bad import path
      # only fails here. Electron Forge packaging is not run on CI because it
      # needs platform-specific signing that the repository does not yet have.
      - name: Build renderer
        run: bun run build:renderer
